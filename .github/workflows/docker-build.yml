name: Build and Push Docker images to GHCR

on:
  push:
    branches: [ "main", "review-3" ]
  pull_request:
    branches: [ "main", "review-3" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/henzerboss/film-react-nest-backend:latest
            ghcr.io/henzerboss/film-react-nest-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/henzerboss/film-react-nest-frontend:latest
            ghcr.io/henzerboss/film-react-nest-frontend:${{ github.sha }}

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/henzerboss/film-react-nest-nginx:latest
            ghcr.io/henzerboss/film-react-nest-nginx:${{ github.sha }}